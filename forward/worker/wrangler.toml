name = "brooks-forward"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Custom domain (zone lfkdsk.org is on the same Cloudflare account; wrangler creates the DNS record).
# Must stay above the [[d1_databases]] table, otherwise TOML attaches it to that table.
routes = [
  { pattern = "brooks.lfkdsk.org", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "brooks_forward"
database_id = "f107c171-8cb0-49e9-bac7-028705d2f232"
# Set WRITE_TOKEN using wrangler secret put; never put it in this file.
